spring.application.name=catalogo-autopecas

# Carrega senha local (copie application-local.properties.example -> application-local.properties)
spring.config.import=optional:classpath:application-local.properties

# MySQL — o banco catalogo_autopecas deve existir (crie com database/01-criar-banco.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_autopecas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (cria/atualiza tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Dados de teste (data.sql) — só depois que o banco existir
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Catálogo — contenido editable (fotos y descripciones)
catalogo.data.dir=./data
catalogo.admin.pin=1234
